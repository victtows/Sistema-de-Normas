<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <link rel="icon" type="image/x-icon" href="../assets/img/logo.ico">
    <title>Controles ISO 27001</title>
</head>
<body>
    <div class="iso-header">
        <a href="index.html" class="back-arrow">&#8592;</a>
        <h1 class="iso-topo">ISO 27001</h1>
    </div>
    
    <div class="container">
        <section class="card formulario">
            <div>
                <p>
                    Selecione a empresa
                </p>
                <select id="empresaSelect">
                    <option value="">
                        Nenhuma empresa selecionada
                    </option>
                </select>
            </div>
        </section>

        <div class="progress-container">

            <div class="progress-info">
        
                <span id="progressText">
                    0 / 0 respondidas
                </span>
        
            </div>
        
            <div class="progress-bar">
        
                <div class="progress-fill" id="progressFill"></div>
        
            </div>
        
        </div>
        <form id="formulario" class="question-card">
            <div class="tab">
                <section class='question'>Insira a descrição aqui 
                    <div class='options'>
                        <label class='radio-option sim'>
                            <input type='radio' name='q1'>
                            <span class='custom-radio'></span>
                            <span>Conforme</span>
                        </label>
                        <label class='radio-option não'>
                            <input type='radio' name='q1'>
                            <span class='custom-radio'></span>
                            <span>Não Conforme</span>
                            <section class='sub-question'>Está em Andamento 
                                <div class='options'>
                                    <label class='radio-option sim'>
                                        <input type='radio' name='q1-sub'>
                                        <span class='custom-radio'></span>
                                        <span>Sim</span>
                                    </label>
                                    <label class='radio-option não'>
                                        <input type='radio' name='q1-sub'>
                                        <span class='custom-radio'></span>
                                        <span>Não</span>
                                    </label>
                                </div>
                            </section>
                        </label>
                        <label class='radio-option NA'>
                            <input type='radio' name='q1'>
                            <span class='custom-radio'></span>
                            <span>Não Aplicavel</span>
                        </label>
                    </div>
                </section>
                <section class='question'>Insira a descrição aqui 
                    <div class='options'>
                        <label class='radio-option sim'>
                            <input type='radio' name='q2'>
                            <span class='custom-radio'></span>
                            <span>Conforme</span>
                        </label>
                        <label class='radio-option não'>
                            <input type='radio' name='q2'>
                            <span class='custom-radio'></span>
                            <span>Não Conforme</span>
                            <section class='sub-question'>Está em Andamento 
                                <div class='options'>
                                    <label class='radio-option sim'>
                                        <input type='radio' name='q2-sub'>
                                        <span class='custom-radio'></span>
                                        <span>Sim</span>
                                    </label>
                                    <label class='radio-option não'>
                                        <input type='radio' name='q2-sub'>
                                        <span class='custom-radio'></span>
                                        <span>Não</span>
                                    </label>
                                </div>
                            </section>
                        </label>
                        <label class='radio-option NA'>
                            <input type='radio' name='q2'>
                            <span class='custom-radio'></span>
                            <span>Não Aplicavel</span>
                        </label>
                    </div>
                </section>

            </div>
            <div style='overflow:auto;'> 
                <div style='float:right; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;'>  
                    <button type='button' id='prevBtn' onclick='nextPrev(-1)'>Previous</button>
                    <button type='button' id='nextBtn' onclick='nextPrev(1)'>Next</button>
                </div>
            </div>
        </form>
        
</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="./script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</html>
