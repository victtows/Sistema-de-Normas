<!DOCTYPE html>
<html lang="pt-br">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="./script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="icon" type="image/x-icon" href="../assets/img/logo.ico">

    <title>Auditoria ISO</title>

    <link rel="stylesheet" href="main.css">

</head>

<body>

    <div class="container">

        <section class="introducao">

            <h1>Auditoria ISO</h1>

            <p>
                Sistema para gestão e conformidade
                com normas ISO.
            </p>

        </section>

        <div class="recursos">

            <section class="card">

                <h2>Normas</h2>
                <div class="isos">
                <button
                    class="norma-btn iso27001"
                    onclick="abrirPagina('iso27001')">

                    <h3>ISO 27001</h3>

                    <p>
                        Gestão de Segurança da Informação
                    </p>

                </button>

                <button
                    class="norma-btn iso27701"
                    onclick="abrirPagina('iso27701')">

                    <h3>ISO 27701</h3>

                    <p>
                        Gestão de Privacidade da Informação
                    </p>

                </button>
                </div>
            </section>

            <section class="card">

                <h2>Empresas</h2>

                <p>
                    Cadastre uma empresa
                </p>

                <div class="cadastro-box">

                    <input
                        type="text"
                        id="novaEmpresa"
                        placeholder="Nome da Empresa"
                    >

                    <input
                        type="text"
                        id="cnpjEmpresa"
                        placeholder="Digite o CNPJ"
                    >

                    <button onclick="cadastrarEmpresa()">
                        Cadastrar Empresa
                    </button>

                </div>

            </section>

        </div>
        <section class="card">
                <h2>
                    Empresas cadastradas
                </h2>

                <select id="empresaSelect">

                    <option value="">
                        Nenhuma empresa cadastrada
                    </option>

                </select>

                <button onclick="abrirPagina('historico')">

                    Ver Histórico

                </button>
            </section>
    </div>

    

</body>
</html>
