<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Auditoria ISO</title>

    <link rel="stylesheet" href="main.css">

</head>

<body>

    <header>

        <div class="logo">

            <img src="/assets/img/logo.png" alt="Logo" class="logo-img">
            <span>Auditoria ISO</span>
        
        </div>

    </header>

    <div class="container">

        <section class="introducao">

            <h1>Auditoria ISO</h1>

            <p>
                Sistema para gestão e conformidade
                com normas ISO.
            </p>

        </section>

        <div class="recursos">

            <section class="card">

                <h2>Normas</h2>

                <button
                    class="norma-btn iso27001"
                    onclick="abrirPagina('iso27001')">

                    <h3>ISO 27001</h3>

                    <p>
                        Gestão de Segurança da Informação
                    </p>

                </button>

                <button
                    class="norma-btn iso27701"
                    onclick="abrirPagina('iso27701')">

                    <h3>ISO 27701</h3>

                    <p>
                        Gestão de Privacidade da Informação
                    </p>

                </button>

            </section>

            <section class="card">

                <h2>Empresas</h2>

                <p>
                    Cadastre uma empresa
                </p>

                <div class="cadastro-box">

                    <input
                        type="text"
                        id="novaEmpresa"
                        placeholder="Nome da Empresa"
                    >

                    <button onclick="cadastrarEmpresa()">
                        Cadastrar Empresa
                    </button>

                </div>

                <p style="margin-top:25px;">
                    Empresas cadastradas
                </p>

                <select id="empresaSelect">

                    <option value="">
                        Nenhuma empresa cadastrada
                    </option>

                </select>

                <button onclick="abrirPagina('historico')">

                    Ver Histórico

                </button>

            </section>

        </div>

    </div>

    <script src="script.js"></script>
    <script>import Chart from 'chart.js/auto';</script>

</body>
</html>
